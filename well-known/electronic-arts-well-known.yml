source: >-
  Live HTTPS probes of the RFC 8615 well-known path list against every host this record
  knows: the registrable domain and www, EA's identity hosts (accounts.ea.com,
  signin.ea.com), the support/investor hosts, the Akamai API edge (api.ea.com,
  gateway.ea.com), the community host (answers.ea.com) and the one reachable EA-hosted
  JSON API host found during contract discovery (drop-api.ea.com).
provider: Electronic Arts
providerId: electronic-arts
summary: >-
  EA serves NO security.txt, api-catalog, ai-plugin.json or A2A agent card on any host.
  It DOES serve real OpenID Connect Discovery 1.0 and RFC 8414 OAuth authorization-server
  metadata on accounts.ea.com (mirrored on signin.ea.com), plus the JWKS those documents
  point at. Those three documents are the only machine-readable contract Electronic Arts
  publishes anywhere on its public surface.
notes:
  - >-
    ir.ea.com answers HTTP 200 with the same ~475KB HTML single-page-app shell for every
    /.well-known/* path probed. That is a catch-all, not a document; every ir.ea.com row
    below is recorded as a MISS despite the 200.
  - >-
    api.ea.com and gateway.ea.com are Akamai edge hostnames that CNAME to the www.ea.com
    property; api.ea.com answers 400 "Invalid URL" to every path, so nothing is served there.
  - >-
    answers.ea.com (EA Forums, hosted on Khoros/Lithium behind Cloudflare) answered a
    "Just a moment..." bot interstitial (403) to every probe. Not evaluated.
