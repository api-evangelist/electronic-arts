notes:
- >-
  No SDKs pointer is wired in apis.yml, deliberately. sdk_count reads client libraries for
  a provider's API; EA has none, and crediting these engineering libraries as API SDKs
  would misreport what an integrator can actually pick up.
- >-
  The approved FC Community API partners (FUT.GG, FUTBIN, FUTWIZ) are not given a client
  library either — EA hands them an OAuth flow and nothing else that is public.
