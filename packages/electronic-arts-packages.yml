  Electronic Arts ships NO API client library, in any language, on any registry — because
  it publishes no public API to wrap. What it does publish are first-party engineering
  libraries: JVM concurrency and agent tooling on Maven Central under com.ea.*, and a .NET
  test-output parser on NuGet from the Frostbite team. Every one of them is stale: the most
  recent release in this set is 2019-05-28, and nothing has shipped in over six years.
