reconciled: true
plan_count: 2
tags:
  - Gaming
  - Entertainment
  - Consumer
  - Subscription
description: >-
  Electronic Arts sells NO API plan. Its only API programme, the EA SPORTS FC Community API
  (launched 2026-07-27), is a closed partner arrangement with three named community sites and
  carries no published price, quota or tier of any kind — EA states outright that it is "not
  accepting requests at this time". The two plans below are the consumer EA Play membership
  tiers, read live from EA's pricing page on 2026-09-06 and recorded so the commercial surface
  is not blank; they are subscription products, not developer plans.
sources:
  - url: https://www.ea.com/ea-play
    status: 200
    note: 'Verbatim on page: "EA Play is just $5.99 a month or $39.99 for a full year." and "$16.99 a month or $119.99 for a full year."'
  - url: https://www.ea.com/games/ea-sports-fc/fc-26/news/pitch-notes-fc26-community-api-update
    status: 200
    note: FC Community API announcement — no pricing, no self-serve access, applications closed.
plans:
  - id: electronic-arts-ea-play
    name: EA Play (Consumer)
    type: subscription
    description: >-
      Consumer membership: game library with add-ons, up to 10 hours of trials of select new
      games before launch, 10% savings on EA digital purchases, member-only in-game rewards.
      One platform per membership. Not a developer API plan.
    entries:
      - label: EA Play monthly
        name: ea_play_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '5.99'
        currency: USD
        userMultiplied: true
      - label: EA Play yearly
        name: ea_play_yearly
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: '39.99'
        currency: USD
        userMultiplied: true
    elements:
      - name: Game library access
      - name: Member rewards
      - name: Up to 10 hours of early trials
      - name: 10% savings on EA digital purchases
  - id: electronic-arts-ea-play-pro
    name: EA Play Pro (Consumer)
    type: subscription
    description: >-
      Consumer membership: unlimited access to premium editions of the latest games, select
      new releases on day one, 10% savings on EA digital purchases, monthly in-game rewards.
      Not a developer API plan.
    entries:
      - label: EA Play Pro monthly
        name: ea_play_pro_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
