        currency: USD
        userMultiplied: true
      - label: EA Play Pro yearly
        name: ea_play_pro_yearly
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: '119.99'
        currency: USD
        userMultiplied: true
    elements:
      - name: Premium editions of latest games
      - name: Select new releases day one
      - name: Monthly in-game rewards
      - name: 10% savings on EA digital purchases
api_plans:
  count: 0
  note: >-
    No paid, metered or free-tier API plan is published by Electronic Arts. FC Community API
    access is granted by approval to named partners only.
