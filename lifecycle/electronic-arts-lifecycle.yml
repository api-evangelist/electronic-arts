deprecation:
  policy_url: https://www.ea.com/service-updates
  policy_name: Online Service Shutdown
  scope: EA game online services, not APIs
  stated_criteria: >-
    EA retires the online services for a title when the remaining players fall to
    "typically fewer than 1% of all peak online players across all EA titles". The policy
    also covers withdrawal of individual features and modes, and states that where online
    services end a title may still be playable offline.
  notice_channel: https://www.ea.com/service-updates
  sunset_header: not observed
  deprecation_header: not observed
  rfc8594: false
  note: >-
    This is a genuine, published retirement policy with a stated trigger — but it governs
    game online services. Nothing EA publishes states a deprecation window, a version
    support horizon, or a Sunset/Deprecation header contract for the EA Account OAuth
    endpoints or for the FC Community API.
