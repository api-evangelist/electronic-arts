aid: electronic-arts
name: Electronic Arts
description: Electronic Arts (EA) is a global leader in digital interactive entertainment, developing
  and delivering games, content, and online services for internet-connected consoles, mobile devices,
  and personal computers. EA's portfolio includes franchises such as EA SPORTS FC, Madden NFL, Battlefield,
  The Sims, Apex Legends, and Need for Speed, supported by online services like the EA app, EA Play, and
  EA Help. EA runs no public developer portal and publishes no OpenAPI, GraphQL, AsyncAPI or gRPC contract.
  Its one API programme is the EA SPORTS FC Community API, announced 2026-07-27, which lets a player grant
  an approved community site (FUT.GG, FUTBIN, FUTWIZ) delegated read access to Ultimate Team data through
  EA's OAuth flow; EA states it is not accepting further partner requests. The only machine-readable documents
  EA serves anywhere are the OpenID Connect Discovery and RFC 8414 authorization-server metadata on accounts.ea.com,
  plus the JWKS they reference.
