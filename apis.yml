apis:
- aid: electronic-arts:electronic-arts
  name: Electronic Arts
  description: Public-facing presence of Electronic Arts. Covers EA's corporate site, consumer game services,
    the EA app, EA Play subscription, and EA Help support surfaces. EA does not publish a developer API
    portal, so this entry is tracked as a Contract-position reference rather than a producer of public
    APIs; the two entries below carry the surfaces that are actually callable or programme-gated.
  humanURL: https://www.ea.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Gaming
