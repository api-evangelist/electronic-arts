  - type: Careers
    url: https://www.ea.com/careers
- aid: electronic-arts:ea-account-connect
  name: EA Account OpenID Connect / OAuth 2.0
  description: EA's account authorization server at accounts.ea.com — the single identity surface behind
    the EA app, EA's web properties and the approved EA SPORTS FC Community API partners. EA serves a
    live OpenID Connect Discovery 1.0 document and RFC 8414 authorization-server metadata here (both fetched
    2026-09-06, HTTP 200, saved verbatim to well-known/), advertising authorization code with PKCE S256,
    RS256 ID tokens and the openid/email/phone/profile scope set. Client credentials are issued by EA;
    there is no public registration endpoint. This is the only machine-readable contract Electronic Arts
    publishes.
  humanURL: https://accounts.ea.com/.well-known/openid-configuration
  baseURL: https://accounts.ea.com/connect
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Authentication
  - OAuth
  - OpenID Connect
  - Identity
  - Gaming
  properties:
  - type: OpenIDConnect
    url: https://accounts.ea.com/.well-known/openid-configuration
  - type: Authentication
    url: authentication/electronic-arts-authentication.yml
  - type: OAuthScopes
    url: scopes/electronic-arts-scopes.yml
  - type: WellKnown
    url: well-known/electronic-arts-well-known.yml
- aid: electronic-arts:fc-community-api
  name: EA SPORTS FC Community API
  description: EA's only API programme, announced 2026-07-27. A player connects their EA Account to an
    approved community site through EA's OAuth login flow and grants that site permission to make specific
    requests to FC services on their behalf; the site can then retrieve EA SPORTS FC account data — Ultimate
    Team players, formations, tactics and more — but never the password or login credentials. Approved
    partners are FUT.GG, FUTBIN and FUTWIZ, and EA states it is not accepting further requests at this
    time. Partners may retain pulled account data for at most 28 days. No base URL, endpoint list, scope
    reference, rate limit or machine-readable spec is published, so no baseURL is recorded here rather
    than guessing one.
  humanURL: https://help.ea.com/en/articles/ea-sports-fc/community-api/
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
