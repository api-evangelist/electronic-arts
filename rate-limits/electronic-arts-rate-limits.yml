limits: []
policies:
  - name: Data retention cap (not a rate limit)
    description: >-
      Approved FC Community API partners may retain pulled account-specific data for up to 28
      days; a new pull inside the window resets the 28 days. Recorded here because it is the
      only quantitative constraint EA publishes on the programme.
    source: https://www.ea.com/games/ea-sports-fc/fc-26/news/pitch-notes-fc26-community-api-update
  - name: Approved partners only
    description: >-
      Only FUT.GG, FUTBIN and FUTWIZ are authorized to call the FC Community API, and EA is not
      accepting further requests. There is no general-population traffic to limit.
