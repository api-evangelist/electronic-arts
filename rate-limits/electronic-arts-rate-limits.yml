description: >-
  Electronic Arts publishes NO rate limits, for any surface. An honest zero: EA's two public
  API-adjacent surfaces — the EA Account OAuth/OIDC endpoints on accounts.ea.com and the
  approved-partner FC Community API — carry no documented quota, window, burst allowance or
  throttling header anywhere on ea.com or help.ea.com. The one limit EA does state for the FC
  Community API is a data-retention cap, not a request rate: partners may keep pulled account
  data for at most 28 days.
notes: >-
  No X-RateLimit-*, RateLimit-* or Retry-After header contract is documented, and no status
  code on exhaustion is stated. Community projects that call EA online-services endpoints do so
  against undocumented, unsupported surfaces; nothing in that space is a published EA limit and
  none of it is recorded here.
